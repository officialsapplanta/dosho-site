<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dosho Admin</title>
<link rel="icon" type="image/png" href="favicon.png?v=2">
<link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;1,300&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --bg: #0D0710;
    --surface: #1C1122;
    --surface-elevated: #241530;
    --border: rgba(250,242,246,0.09);
    --text-primary: #FAF2F6;
    --text-secondary: #B29CAE;
    --text-tertiary: #8F7A8B;
    --accent: #FF6FA8;
    --accent-2: #E84393;
    --danger: #ff6b7a;
    --warning: #ffc36b;
    --online: #5eead4;
    --serif: "Fraunces", Georgia, serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    background-image: radial-gradient(48rem 28rem at 70% -10%, rgba(232,67,147,0.16), transparent 70%);
    background-attachment: fixed;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .hidden { display: none !important; }
  button { transition: background 0.15s ease, opacity 0.15s ease, transform 0.1s ease; }

  /* Login */
  #loginScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }
  #loginScreen::before {
    content: "";
    position: absolute;
    width: 480px;
    height: 480px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(247,37,133,0.14) 0%, rgba(181,23,158,0.05) 45%, transparent 70%);
    pointer-events: none;
  }
  .login-card {
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 32px;
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .brand img { width: 38px; height: 38px; border-radius: 10px; display: block; box-shadow: 0 6px 20px rgba(232,67,147,0.35); }
  .brand span { font-family: var(--serif); font-size: 24px; font-style: italic; font-weight: 300; letter-spacing: -0.01em; }
  .brand small { font-family: "Inter", sans-serif; font-style: normal; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); margin-left: 2px; }
  .login-sub { color: var(--text-secondary); font-size: 13px; margin-bottom: 24px; }
  input[type="password"], input[type="text"], input[type="number"] {
    width: 100%;
    padding: 12px 14px;
    background: var(--surface-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-primary);
    font-size: 14px;
    margin-bottom: 12px;
    transition: border-color 0.15s ease;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    cursor: pointer;
    border: none;
    font-family: inherit;
  }
  .btn-primary {
    width: 100%;
    color: #1a0713;
    padding: 12px;
    border-radius: 10px;
    background: linear-gradient(135deg, #FFC5DD, var(--accent));
    color: #1a0713;
    font-weight: 600;
    font-size: 14px;
  }
  .btn-primary:hover:not(:disabled) { opacity: 0.92; }
  .btn-primary:disabled { opacity: 0.5; cursor: default; }
  .error-text { color: var(--danger); font-size: 13px; margin: 8px 0; }

  /* Shell */
  #appShell { display: flex; min-height: 100vh; }
  nav.sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 20px 12px;
    display: flex;
    flex-direction: column;
  }
  .sidebar-logo { margin: 0 8px 22px; }
  .sidebar-logo .brand { margin: 0; }
  .sidebar-logo .brand img { width: 32px; height: 32px; border-radius: 9px; }
  .sidebar-logo .brand span { font-size: 21px; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    padding: 10px 12px;
    border-radius: 10px;
    background: transparent;
    color: var(--text-secondary);
    font-size: 14px;
    margin-bottom: 2px;
    border-left: 2px solid transparent;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .nav-item .nav-icon { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.75; }
  .nav-item.active { background: var(--surface-elevated); color: var(--text-primary); border-left-color: var(--accent); }
  .nav-item.active .nav-icon { opacity: 1; }
  .nav-item:hover { color: var(--text-primary); background: var(--surface-elevated); }
  main { flex: 1; padding: 28px 32px; max-width: 1180px; min-width: 0; }
  h1 { font-family: var(--serif); font-weight: 300; font-style: italic; font-size: 28px; margin: 0 0 18px; letter-spacing: -0.01em; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 28px; }
  .stat-card {
    background: var(--surface);
    background-image: radial-gradient(circle at top left, rgba(247,37,133,0.08), transparent 65%);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .stat-card:hover { border-color: rgba(247,37,133,0.35); transform: translateY(-1px); }
  .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-tertiary); margin-bottom: 6px; }
  .stat-value { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }

  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  th, td { text-align: left; padding: 12px 14px; font-size: 13px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-tertiary); text-transform: uppercase; font-size: 11px; letter-spacing: 0.06em; font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  tbody tr { transition: background 0.12s ease; }
  tbody tr:hover { background: var(--surface-elevated); }

  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pill-pending { background: rgba(255,193,7,0.15); color: var(--warning); }
  .pill-approved, .pill-paid, .pill-confirmed { background: rgba(52,211,153,0.15); color: var(--online); }
  .pill-rejected, .pill-failed { background: rgba(255,90,90,0.15); color: var(--danger); }

  .btn-sm {
    padding: 5px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    margin-right: 6px;
  }
  .btn-approve { background: var(--online); color: #04150e; }
  .btn-approve:hover { opacity: 0.88; }
  .btn-reject { background: var(--danger); color: #2a0a10; }
  .btn-reject:hover { opacity: 0.88; }
  .btn-neutral { background: var(--surface-elevated); color: var(--text-primary); border: 1px solid var(--border); }

  .tab-bar { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab-btn { padding: 6px 14px; border-radius: 999px; background: var(--surface-elevated); color: var(--text-secondary); font-size: 13px; transition: background 0.15s ease, color 0.15s ease; }
  .tab-btn:hover { color: var(--text-primary); }
  .tab-btn.active { background: var(--accent); color: #1a0713; font-weight: 600; }

  .doc-links a { margin-right: 10px; font-size: 12px; }

  .loading, .empty { color: var(--text-tertiary); padding: 32px 20px; text-align: center; font-size: 13px; }

  /* --- dashboard, directory, drawer --- */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; align-items: center; }
  .chip { padding: 6px 14px; border-radius: 999px; background: var(--surface-elevated); color: var(--text-secondary); font-size: 13px; border: 1px solid var(--border); }
  .chip:hover { color: var(--text-primary); }
  .chip.active { background: var(--accent); color: #1a0713; font-weight: 600; border-color: transparent; }
  .attn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 22px; }
  .attn { text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; color: var(--text-primary); }
  .attn:hover { border-color: rgba(255,111,168,0.4); }
  .attn .n { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .attn .l { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .attn.hot { border-color: rgba(255,111,168,0.55); background-image: radial-gradient(circle at top left, rgba(255,111,168,0.14), transparent 70%); }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; margin-bottom: 16px; }
  .panel h2 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-tertiary); font-weight: 600; }
  .two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .bar-row { display: grid; grid-template-columns: 120px 1fr auto; gap: 10px; align-items: center; font-size: 13px; padding: 5px 0; }
  .bar { height: 8px; border-radius: 999px; background: var(--surface-elevated); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, #FFC5DD, var(--accent-2)); border-radius: 999px; }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .kv:last-child { border-bottom: none; }
  .kv b { font-variant-numeric: tabular-nums; }
  .muted { color: var(--text-tertiary); font-size: 12px; }
  .searchbar { display: flex; gap: 10px; margin-bottom: 12px; }
  .searchbar input { margin: 0; flex: 1; }
  .rowlink { cursor: pointer; }
  .pill-creator { background: rgba(255,111,168,0.16); color: var(--accent); }
  .pill-member { background: rgba(178,156,174,0.16); color: var(--text-secondary); }
  .pill-off { background: rgba(255,107,122,0.16); color: var(--danger); }
  .drawer-back { position: fixed; inset: 0; background: rgba(5,2,8,0.6); z-index: 40; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: var(--surface); border-left: 1px solid var(--border); z-index: 41; padding: 22px; overflow-y: auto; box-shadow: -20px 0 60px rgba(0,0,0,0.4); }
  .drawer h3 { font-family: var(--serif); font-style: italic; font-weight: 300; font-size: 24px; margin: 0 0 4px; }
  .pager { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--surface-elevated); border: 1px solid var(--border); padding: 10px 18px; border-radius: 999px; font-size: 13px; z-index: 60; }

  @media (max-width: 720px) {
    #appShell { flex-direction: column; }
    nav.sidebar { width: 100%; flex-direction: row; align-items: center; gap: 8px; padding: 12px; overflow-x: auto; }
    .sidebar-logo { margin: 0 10px 0 0; }
    .nav-item { border-left: none; border-bottom: 2px solid transparent; white-space: nowrap; }
    .nav-item.active { border-left-color: transparent; border-bottom-color: var(--accent); }
    #logoutBtn { margin-top: 0 !important; }
    main { padding: 16px; }
    table { display: block; overflow-x: auto; }
  }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="brand"><img src="dosho-mark.png" alt=""><span>Dosho <small>Admin</small></span></div>
    <div class="login-sub">Sign in to manage Dosho</div>
    <input type="password" id="passwordInput" placeholder="Admin password" />
    <div class="error-text hidden" id="loginError"></div>
    <button class="btn-primary" id="loginBtn">Sign In</button>
  </div>
</div>

<div id="appShell" class="hidden">
  <nav class="sidebar">
    <div class="sidebar-logo"><div class="brand"><img src="dosho-mark.png" alt=""><span>Dosho</span></div></div>
    <button class="nav-item active" data-view="overview">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      Dashboard
    </button>
    <button class="nav-item" data-view="bizreport">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>
      Business report
    </button>
    <button class="nav-item" data-view="users">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      People
    </button>
    <button class="nav-item" data-view="verifications">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
      Verifications
    </button>
    <button class="nav-item" data-view="payouts">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 6v12M18 6v12"/></svg>
      Payouts
    </button>
    <button class="nav-item" data-view="affiliate-payouts">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Affiliate Payouts
    </button>
    <button class="nav-item" data-view="transactions">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-4 4"/></svg>
      Transactions
    </button>
    <button class="nav-item" data-view="rooms">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
      Rooms
    </button>
    <button class="nav-item" data-view="reports">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      Moderation
    </button>
    <button class="nav-item" data-view="growth">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 14 4-4 3 3 5-6"/></svg>
      Growth
    </button>
    <button class="nav-item" id="logoutBtn" style="margin-top: auto; color: var(--text-tertiary);">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Log out
    </button>
  </nav>
  <main>
    <div id="view-overview"></div>
    <div id="view-bizreport" class="hidden"></div>
    <div id="view-users" class="hidden"></div>
    <div id="view-verifications" class="hidden"></div>
    <div id="view-payouts" class="hidden"></div>
    <div id="view-affiliate-payouts" class="hidden"></div>
    <div id="view-transactions" class="hidden"></div>
    <div id="view-rooms" class="hidden"></div>
    <div id="view-reports" class="hidden"></div>
    <div id="view-growth" class="hidden"></div>
  </main>
</div>

<script>
const API_BASE = "https://dosho-api-production.up.railway.app";
const TOKEN_KEY = "dosho_admin_token";

function getToken() { return localStorage.getItem(TOKEN_KEY); }
function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
function clearToken() { localStorage.removeItem(TOKEN_KEY); }

async function api(path, options = {}) {
  const res = await fetch(API_BASE + path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + getToken(),
      ...(options.headers || {}),
    },
  });
  if (res.status === 401) {
    clearToken();
    showLogin();
    throw new Error("Session expired");
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Request failed");
  return data;
}

function fmtDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}

function pillHtml(status) {
  const cls = "pill-" + status;
  return `<span class="pill ${cls}">${status}</span>`;
}

// Advisory-only automated pre-screen signals from services/verificationAnalysis.ts,
// livenessAnalysis.ts, and decisionEngine.ts -- none of these ever set `status`
// themselves, they're just flags/a suggestion for the human reviewer here.
function signalsHtml(v) {
  const flags = [];
  const flagPill = (ok, label) => `<span class="pill ${ok === null ? "pill-pending" : ok ? "pill-approved" : "pill-rejected"}" style="margin:2px 4px 2px 0;">${label}</span>`;

  flags.push(
    v.faceMatchDistance == null
      ? flagPill(null, "Face: n/a")
      : flagPill(!v.faceMatchFlagged, `Face Δ${v.faceMatchDistance.toFixed(2)}`)
  );
  flags.push(v.ocrNameMatches == null ? flagPill(null, "OCR: n/a") : flagPill(v.ocrNameMatches, v.ocrNameMatches ? "Name matches ID" : "Name not on ID"));
  flags.push(v.livenessPassed == null ? flagPill(null, "Liveness: n/a") : flagPill(v.livenessPassed, v.livenessPassed ? "Liveness OK" : "Liveness failed"));
  if (v.duplicateOfUserId) {
    flags.push(flagPill(false, `Dup of ${v.duplicateOfUsername ? "@" + v.duplicateOfUsername : v.duplicateOfEmail || v.duplicateOfUserId}`));
  }
  if (v.gpsCountryMatches === false) flags.push(flagPill(false, "GPS mismatch"));

  const outcomeCls = { auto_approve: "pill-approved", manual_review: "pill-pending", reject: "pill-rejected" }[v.decisionOutcome] || "pill-pending";
  const suggestion = v.decisionOutcome
    ? `<div style="margin-top:4px"><span class="pill ${outcomeCls}">Suggested: ${v.decisionOutcome.replace("_", " ")} (${Math.round((v.decisionScore ?? 0) * 100)}%)</span></div>`
    : "";

  return flags.join("") + suggestion;
}

function showLogin() {
  document.getElementById("loginScreen").classList.remove("hidden");
  document.getElementById("appShell").classList.add("hidden");
}

function showApp() {
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("appShell").classList.remove("hidden");
  loadView(currentView);
}

document.getElementById("loginBtn").addEventListener("click", login);
document.getElementById("passwordInput").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });

async function login() {
  const password = document.getElementById("passwordInput").value;
  const errorEl = document.getElementById("loginError");
  errorEl.classList.add("hidden");
  try {
    const res = await fetch(API_BASE + "/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Login failed");
    setToken(data.token);
    showApp();
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.classList.remove("hidden");
  }
}

document.getElementById("logoutBtn").addEventListener("click", () => {
  clearToken();
  showLogin();
});

let currentView = "overview";
document.querySelectorAll(".nav-item[data-view]").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".nav-item[data-view]").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    document.querySelectorAll("main > div").forEach((v) => v.classList.add("hidden"));
    currentView = btn.dataset.view;
    document.getElementById("view-" + currentView).classList.remove("hidden");
    loadView(currentView);
  });
});

function loadView(view) {
  if (view === "overview") loadOverview();
  if (view === "bizreport") loadBizReport("24h");
  if (view === "users") loadUsers();
  if (view === "verifications") loadVerifications("pending");
  if (view === "payouts") loadPayouts("pending");
  if (view === "affiliate-payouts") loadAffiliatePayouts("pending");
  if (view === "transactions") loadTransactions();
  if (view === "rooms") loadRooms("live");
  if (view === "reports") loadReports("pending");

async function runSeed() {
  const btn = document.getElementById("run-seed-btn");
  const keyInput = document.getElementById("seed-key");
  const resultEl = document.getElementById("seed-result");
  const key = keyInput.value.trim();
  if (!key) {
    resultEl.textContent = "Paste the ADMIN_SEED_KEY value first.";
    return;
  }
  btn.disabled = true;
  resultEl.textContent = "Running…";
  try {
    // Not routed through api() -- this endpoint checks the x-admin-seed-key
    // header, a separate secret from the admin login password api() sends.
    const res = await fetch(API_BASE + "/admin/seed", {
      method: "POST",
      headers: { "x-admin-seed-key": key },
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Request failed");
    const created = data.creatorsCreated?.length ? `Created: ${data.creatorsCreated.join(", ")}. ` : "";
    const reset = data.ratesReset?.length ? `Rates reset: ${data.ratesReset.join(", ")}.` : "No existing accounts to reset.";
    resultEl.textContent = created + reset;
  } catch (err) {
    resultEl.textContent = err.message;
  } finally {
    btn.disabled = false;
  }
}

async function uploadDemoPhotos() {
  const btn = document.getElementById("upload-demo-photos");
  const resultEl = document.getElementById("demo-photos-result");
  btn.disabled = true;
  resultEl.textContent = "Uploading…";
  const ids = ["amara", "naomi", "zuri"];
  const summaries = [];
  let anyPicked = false;
  // One request per photo rather than batched -- these are user-picked
  // local images of unknown size, and batching all 3 into one JSON body
  // risks tripping the backend's 10mb request limit.
  for (const id of ids) {
    const fileInput = document.getElementById(`photo-${id}`);
    const file = fileInput.files[0];
    if (!file) continue;
    anyPicked = true;
    const email = `${id}.demo@dosho.app`;
    try {
      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      const country = document.getElementById(`country-${id}`).value || "KE";
      const result = await api("/admin/demo-photos", {
        method: "POST",
        body: JSON.stringify({ photos: [{ email, photoDataUrl: dataUrl, country }] }),
      });
      const r = result.results[0];
      summaries.push(`${email}: ${r.ok ? "done" : r.error}`);
    } catch (err) {
      summaries.push(`${email}: ${err.message}`);
    }
  }
  if (!anyPicked) {
    resultEl.textContent = "Pick at least one photo first.";
    btn.disabled = false;
    return;
  }

  const allOk = summaries.every((s) => s.endsWith(": done"));
  resultEl.textContent = allOk ? "Done ✓" : summaries.join(" · ");
  btn.disabled = false;

  // Reset back to the empty form a couple seconds after a clean success --
  // an error stays on screen so it can actually be read/acted on.
  if (allOk) {
    setTimeout(() => {
      ids.forEach((id) => {
        const fileInput = document.getElementById(`photo-${id}`);
        if (fileInput) fileInput.value = "";
        const countryInput = document.getElementById(`country-${id}`);
        if (countryInput) countryInput.value = "KE";
      });
      resultEl.textContent = "";
    }, 2000);
  }
}

  } catch (err) { document.getElementById("dir-body").innerHTML = `<div class="error-text">${esc(err.message)}</div>`; }
}
window.dirFilter = (k) => { dirState.filter = k; dirState.page = 1; dirState.q = ""; loadUsers(); };
window.dirPage = (d) => { dirState.page = Math.max(1, dirState.page + d); loadUsers(); };
window.dirSearch = () => { dirState.q = document.getElementById("dir-q").value.trim(); dirState.page = 1; loadUsers(); };

window.openPerson = async (id) => {
  closePerson();
  const back = document.createElement("div");
  back.className = "drawer-back"; back.id = "drawer-back"; back.onclick = closePerson;
  const dr = document.createElement("aside");
  dr.className = "drawer"; dr.id = "drawer"; dr.innerHTML = `<div class="loading">Loading...</div>`;
  document.body.append(back, dr);
  try {
    const u = await api("/admin/directory/" + id);
    dr.innerHTML = `
      <button class="btn-sm btn-neutral" onclick="closePerson()" style="float:right">Close</button>
      <div style="display:flex;justify-content:center;margin:6px 0 10px">${avatarHtml(u, 112)}</div>
      <h3 style="text-align:center">${esc(u.username ? "@" + u.username : u.name || "No handle")}</h3>
      <div class="muted" style="margin-bottom:12px">${esc(u.name || "")} ${u.name ? "·" : ""} ${esc(u.email)}</div>
      <div class="chips"><span class="pill pill-${u.role}">${u.role}</span>
        ${u.deleted ? `<span class="pill pill-off">deleted${u.purged ? " · anonymized" : ""}</span>` : u.isActive ? `<span class="pill pill-approved">active</span>` : `<span class="pill pill-off">deactivated</span>`}
        ${u.role === "creator" ? `<span class="pill pill-pending">verification: ${esc(u.verification)}</span>` : ""}</div>
      <div class="panel">
        <div class="kv"><span>Joined</span><b>${fmtDate(u.createdAt)}</b></div>
        <div class="kv"><span>Country</span><b>${esc(u.country || "—")}</b></div>
        <div class="kv"><span>Coins in wallet</span><b>${u.walletCoins.toLocaleString()}</b></div>
        <div class="kv"><span>Purchases</span><b>${u.purchases.count} · ${kes(u.purchases.kes)}</b></div>
        <div class="kv"><span>Paid out</span><b>${u.paidOut.count} · ${kes(u.paidOut.kes)}</b></div>
        <div class="kv"><span>Messages sent</span><b>${u.messagesSent.toLocaleString()}</b></div>
        <div class="kv"><span>Referrals · referred by</span><b>${u.referrals} · ${esc(u.referredBy ? "@" + u.referredBy : "—")}</b></div>
        <div class="kv"><span>Reports against</span><b>${u.reportsAgainst}</b></div>
        <div class="kv"><span>Heat score</span><b>${u.heatScore}</b></div>
      </div>
      ${u.gallery && u.gallery.filter(Boolean).length ? `<div class="panel"><h2>Gallery</h2><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px">${u.gallery.filter(Boolean).map((g) => `<a href="${esc(g)}" target="_blank" rel="noopener"><img src="${esc(g)}" alt="" loading="lazy" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px"></a>`).join("")}</div></div>` : ""}
      <div class="panel"><h2>Recent payments</h2>
        ${u.recentPayments.length ? u.recentPayments.map((p) => `<div class="kv"><span>${fmtDate(p.createdAt)} · ${esc(p.status)}</span><b>${kes(p.amountKes)}</b></div>`).join("") : `<div class="muted">None.</div>`}
      </div>
      ${u.deleted ? "" : `<div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn-sm btn-neutral" onclick="changeRole('${u.id}', '${u.role === "creator" ? "member" : "creator"}')" style="padding:9px 16px">${u.role === "creator" ? "Make a member" : "Make a creator"}</button>
        <button class="btn-sm ${u.isActive ? "btn-reject" : "btn-approve"}" onclick="togglePerson('${u.id}', ${!u.isActive})" style="padding:9px 16px">${u.isActive ? "Deactivate account" : "Reactivate account"}</button>
      </div>
      ${u.role === "member" ? `<p class="muted" style="margin-top:10px">A new creator still has to pass ID verification before they appear in Discover. They get a notification to finish it.</p>` : ""}`}`;
  } catch (err) { dr.innerHTML = `<button class="btn-sm btn-neutral" onclick="closePerson()">Close</button><div class="error-text">${esc(err.message)}</div>`; }
};
window.changeRole = async (id, role) => {
  const msg = role === "creator" ? "Make this person a creator? They will be asked to finish ID verification." : "Turn this creator back into a member? They will leave creator Discover.";
  if (!confirm(msg)) return;
  try { const r = await api(`/admin/directory/${id}/role`, { method: "POST", body: JSON.stringify({ role }) }); toast(r.message); openPerson(id); loadUsers(); }
  catch (err) { toast(err.message); }
};
window.closePerson = () => { document.getElementById("drawer")?.remove(); document.getElementById("drawer-back")?.remove(); };
window.togglePerson = async (id, active) => {
  if (!active && !confirm("Deactivate this account? They will be signed out of using Dosho until reactivated.")) return;
  try { await api(`/admin/directory/${id}/active`, { method: "POST", body: JSON.stringify({ active }) }); toast(active ? "Reactivated" : "Deactivated"); openPerson(id); loadUsers(); }
  catch (err) { toast(err.message); }
};

// ---- Verifications ----
async function loadVerifications(status) {
  const el = document.getElementById("view-verifications");
  el.innerHTML = renderTabs("verifications", ["pending", "approved", "rejected"], status) + `<div class="loading">Loading...</div>`;
  try {
    const items = await api("/admin/verifications?status=" + status);
    const body = el.querySelector(".loading")?.parentElement || el;
    const tableHtml = !items.length ? `<div class="empty">No ${status} verifications.</div>` : `<table>
      <thead><tr><th>User</th><th>Legal Name</th><th>ID Type</th><th>Photos</th><th>Automated signals</th><th>Submitted</th><th>Actions</th></tr></thead>
      <tbody>${items.map(v => `
        <tr>
          <td>${v.email}${v.username ? `<br><span style="color:var(--text-tertiary)">@${v.username}</span>` : ""}</td>
          <td>${v.legalFullName || "—"}</td>
          <td>${v.idType || "—"}</td>
          <td class="doc-links">
            ${v.idPhotoUrl ? `<a href="#" onclick="viewPrivateImage('${v.idPhotoUrl}'); return false;">ID</a>` : ""}
            ${v.selfieUrl ? `<a href="#" onclick="viewPrivateImage('${v.selfieUrl}'); return false;">Selfie</a>` : ""}
          </td>
          <td style="max-width:220px">${signalsHtml(v)}</td>
          <td>${fmtDate(v.submittedAt)}</td>
          <td>
            ${v.status === "pending" ? `
              <button class="btn-sm btn-approve" onclick="reviewVerification('${v.id}', true)">Approve</button>
              <button class="btn-sm btn-reject" onclick="reviewVerification('${v.id}', false)">Reject</button>
            ` : pillHtml(v.status)}
          </td>
        </tr>
      `).join("")}</tbody>
    </table>`;
    el.innerHTML = renderTabs("verifications", ["pending", "approved", "rejected"], status) + tableHtml;
  } catch (err) {
    el.innerHTML = renderTabs("verifications", ["pending", "approved", "rejected"], status) + `<div class="error-text">${err.message}</div>`;
  }
}

// Private uploads require the admin bearer token, which a plain <a href>
// click can't send — fetch as a blob with the header, then open the
// resulting object URL instead.
window.viewPrivateImage = async function (url) {
  try {
    const path = url.replace(API_BASE, "");
    const res = await fetch(API_BASE + path, { headers: { Authorization: "Bearer " + getToken() } });
    if (!res.ok) throw new Error("Could not load image");
    const blob = await res.blob();
    window.open(URL.createObjectURL(blob), "_blank");
  } catch (err) {
    alert(err.message);
  }
};

window.reviewVerification = async function (id, approve) {
  let rejectionReason;
  if (!approve) {
    rejectionReason = prompt("Rejection reason (shown to no one yet, stored for records):") || "Did not meet verification requirements";
  }
  try {
    await api(`/admin/verifications/${id}/review`, {
      method: "POST",
      body: JSON.stringify({ approve, rejectionReason }),
    });
    loadVerifications(document.querySelector('#view-verifications .tab-btn.active')?.dataset.tab || "pending");
  } catch (err) {
    alert(err.message);
  }
};

// ---- Transactions ----
async function loadTransactions() {
  const el = document.getElementById("view-transactions");
  el.innerHTML = `<h1>Transactions</h1><div class="loading">Loading...</div>`;
  try {
    const items = await api("/admin/transactions?limit=100");

      <tbody>${items.map(t => `

      `).join("")}</tbody>

window.terminateRoom = async function (id) {

    loadRooms(document.querySelector('#view-rooms .tab-btn.active')?.dataset.tab || "live");

};

  try {
    const items = await api("/admin/reports?status=" + status);

window.reviewReport = async function (id, deactivateUser) {
  if (deactivateUser && !confirm("Deactivate this user's account?")) return;
  try {
    await api(`/admin/reports/${id}/review`, { method: "POST", body: JSON.stringify({ deactivateUser }) });
    loadReports(document.querySelector('#view-reports .tab-btn.active')?.dataset.tab || "pending");
  } catch (err) { alert(err.message); }
};
window.loadReports = loadReports;

// ---- Shared tab bar ----
function renderTabs(view, statuses, active) {
  const title = view.charAt(0).toUpperCase() + view.slice(1);
  return `<h1>${title}</h1><div class="tab-bar">${statuses.map(s =>
    `<button class="tab-btn ${s === active ? 'active' : ''}" data-tab="${s}" onclick="window.load${title}('${s}')">${s}</button>`
  ).join("")}</div>`;
}
window.loadVerifications = loadVerifications;
window.loadPayouts = loadPayouts;
window.loadRooms = loadRooms;

// ---- Init ----

  showApp();
} else {
  showLogin();
}
