<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Complete</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #07070d;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 24px;
  }
  .card { max-width: 340px; }
  .check {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, #f72585, #b5179e);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
    font-size: 28px;
  }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { color: rgba(255,255,255,0.65); font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>Payment received</h1>
    <p>You can close this window and return to the Dosho app — your coins will appear shortly.</p>
  </div>
</body>
</html>
