<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by the --base-href given to `flutter build web` (the app is served from /app/). -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Dosho: real people, real conversations. One mission a day, rooms you can just listen to, and calls with verified creators.">
  <meta name="theme-color" content="#0D0710">

  <!-- Add to Home Screen (iPhone, iPad, Android) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dosho">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">

  <title>Dosho</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #0D0710; }
    /* Shown for the moment before the app has loaded. */
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #0D0710; color: #FAF2F6; font-family: Georgia, serif; font-style: italic; font-size: 28px; letter-spacing: -0.01em; }
    #boot img { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 10px 30px rgba(232,67,147,0.4); }
  </style>
</head>
<body>
  <div id="boot"><img src="icons/Icon-192.png" alt=""><span>Dosho</span></div>

  <!-- Daily's browser call library and the small bridge the app uses to talk to it. -->
  <script src="daily-js.js"></script>
  <script src="daily_bridge.js"></script>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Remove the loading screen once Flutter has drawn its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (boot) boot.remove();
    });
  </script>
</body>
</html>
